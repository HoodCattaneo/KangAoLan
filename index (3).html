body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.notice{background:var(--warn-soft);border-radius:12px;padding:12px 16px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.listen{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.play{font:inherit;font-family:var(--display);font-weight:600;font-size:20px;border:0;border-radius:999px;background:var(--accent);color:var(--surface);padding:16px 28px;cursor:pointer;display:flex;align-items:center;gap:10px}
.play svg{width:22px;height:22px;fill:currentColor}
.slow{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);cursor:pointer}
.prompt{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-family:var(--display);font-weight:600;font-size:26px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:14px 10px;cursor:pointer;min-width:0}
.opts.wide{grid-template-columns:1fr}
.opts.wide .opt{font-size:20px;text-align:left;padding:14px 16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.feedback{border-radius:12px;padding:14px 16px;background:var(--accent-soft)}
.feedback strong{display:block;font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:2px}
.feedback.good strong{color:var(--good)} .feedback.bad strong{color:var(--bad)}
.han{font-family:var(--han);font-size:1.15em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:var(--surface);cursor:pointer}
.ghost{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.parent{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.parent .reveal{color:var(--fg);font-size:17px;margin-top:4px}
.score{font-family:var(--display);font-weight:600;font-size:56px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.missed li{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.missed .a{color:var(--good);font-weight:700}
.rules{font-size:15px;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px}
.rules code{font-family:var(--body);font-weight:700;color:var(--fg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{font:inherit;font-family:var(--display);font-weight:600;font-size:17px;border:0;border-radius:9px;padding:10px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.target{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.target .py{font-family:var(--display);font-weight:600;font-size:48px;line-height:1}
.target .fin{font-size:15px;color:var(--muted)}
.mic{font:inherit;font-family:var(--display);font-weight:600;font-size:20px;border:2px solid var(--accent);border-radius:999px;background:var(--surface);color:var(--accent);padding:14px 26px;cursor:pointer;display:flex;align-items:center;gap:10px}
.mic svg{width:22px;height:22px;fill:currentColor}
.mic.on{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.small{font-size:14px;color:var(--muted);margin:0}
.wrap>header,.rules{background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:14px;padding:14px 18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sec{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.sec b{font-family:var(--display);font-weight:600;font-size:17px}
.sec span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sec[aria-pressed="true"] b{color:var(--accent)}
@media (max-width:640px){.sec b{font-size:14px}.sec span{font-size:11px}}
.rules{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.py.en{font-size:30px;line-height:1.25}
.py-line{font-family:var(--display);font-weight:600;font-size:24px;color:var(--accent)}
.big{font-size:1.3em}
.dict-in{font:inherit;font-family:var(--display);font-size:28px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.dict-in:focus{outline:none;border-color:var(--accent)}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tone-b{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.tone-b b{font-family:var(--display);font-size:26px}
.tone-b span{font-size:12px;color:var(--muted)}
.tone-b[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chart-row{display:inline-block;margin-top:8px;font-family:var(--display);font-weight:600;color:var(--accent)}
.passage{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.ptitle{font-family:var(--display);font-size:18px}
.pl{margin:6px 0;font-size:19px;line-height:1.5}
.zh{display:block;color:var(--muted);font-size:16px}
.cg-tray{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed var(--line);border-radius:14px;min-height:56px}
.cg-tile{font:inherit;font-family:var(--display);font-weight:600;font-size:20px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--fg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.cg-tile.sel{background:var(--accent);color:var(--surface)}
.cg-tile.lifting{opacity:.3}
.cg-ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.1);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cg-board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:640px){.cg-board{grid-template-columns:repeat(3,1fr)}}
.cg-col{border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:90px;min-width:0;cursor:pointer;transition:background .15s}
.cg-head{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);border-bottom:1.5px solid var(--line);width:100%;text-align:center;padding-bottom:4px}
.cg-done{font-family:var(--display);font-weight:600;font-size:17px;color:var(--good)}
.cg-slot{display:inline-block;width:40px;height:18px;border-bottom:2px dashed var(--line)}
.cg-slot.wide{width:56px}
.over{background:var(--accent-soft);border-color:var(--accent)}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06);background:var(--good-soft)}}
.shake{animation:shake .45s;border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.cg-hidden{display:flex;flex-wrap:wrap;gap:8px}
.cg-hrow{display:flex;align-items:center;gap:4px;font-size:20px;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-family:var(--display)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 2s ease-in forwards}
@keyframes fall{to{top:105vh;transform:rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.pop,.shake,.cf{animation:none}}
.g-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.g-intro>svg{width:84px;height:92px}
.g-intro h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0;color:var(--accent)}
.g-intro p{margin:0;max-width:44ch}
.big-btn{font-size:20px;padding:14px 36px;margin-top:8px}
.holes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hole{font:inherit;position:relative;height:150px;border:0;border-radius:50% 50% 18px 18px/30% 30% 18px 18px;background:radial-gradient(ellipse at 50% 100%,#5b4637 0 38%,transparent 39%),var(--accent-soft);overflow:hidden;cursor:pointer;padding:0}
.mole{position:absolute;left:50%;bottom:-120px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:bottom .25s ease-out}
.mole svg{width:70px;height:76px}
.mole b{font-family:var(--display);font-size:28px;background:var(--surface);color:var(--fg);border-radius:10px;padding:0 10px;margin-top:-6px;border:2px solid var(--line)}
.hole.up .mole{bottom:6px}
.hole.right .mole b{background:var(--good-soft);border-color:var(--good)}
.hole.wrong .mole b{background:var(--bad-soft);border-color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{font:inherit;font-family:var(--display);font-weight:600;font-size:17px;height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--accent);color:var(--surface);cursor:pointer;padding:4px;min-width:0;line-height:1.2}
.mcard .front{display:none}
.mcard.flip,.mcard.got{background:var(--surface);color:var(--fg)}
.mcard.flip .front,.mcard.got .front{display:inline}
.mcard.flip .back,.mcard.got .back{display:none}
.mcard.got{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.sky{height:130px;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(var(--accent-soft),var(--surface))}
.floater{position:absolute;top:34px;display:flex;gap:4px;animation:drift 7s ease-in-out infinite alternate}
.floater.stop{animation-play-state:paused}
@keyframes drift{from{left:2%;transform:translateX(0)}to{left:98%;transform:translateX(-100%)}}
.ltr{font:inherit;font-family:var(--display);font-weight:600;font-size:40px;width:52px;height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.ltr.hit{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ltr.miss{border-color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){.floater{animation:none;left:10%}.mole{transition:none}}
@media (max-width:640px){.hole{height:112px}.mole{bottom:-100px}.mole svg{width:54px;height:58px}.mole b{font-size:22px}}
.g-modes{justify-content:center}
.mole b.long{font-size:17px;white-space:nowrap}
.fake-card{font-family:var(--display);font-weight:600;font-size:56px;text-align:center;padding:24px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.fake-card.good-c{border-color:var(--good);background:var(--good-soft)}
.fake-card.bad-c{border-color:var(--bad);background:var(--bad-soft)}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rf .btn{font-size:22px;padding:16px}
.rf-fake{background:var(--bad)}
.floater.still{animation:none;left:50%;transform:translateX(-50%)}
.pace{align-items:center}
.cmp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.cmp-b{font:inherit;border-radius:999px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.cmp-b.bad{border-color:var(--bad)}
.cmp-b.good{border-color:var(--good)}
.cmp-b b{font-family:var(--display)}
.syl{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.syl .tones{grid-template-columns:repeat(auto-fit,minmax(58px,1fr))}
.fixes{margin:6px 0 0;padding-left:18px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.res th,.res td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.res th{font-size:13px;color:var(--muted);font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.m{background:var(--warn-soft);color:var(--fg)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.sec-test{grid-column:span 2;border-color:var(--accent)}
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px)}
.tb-space{flex:1}
.back{font-weight:700;text-decoration:none;font-size:17px}
.buddy-chip{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-variant-numeric:tabular-nums}
.mini-panda{width:30px;height:32px}

#home{display:flex;flex-direction:column;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}

.badge.got{opacity:1;filter:none;border-style:solid;border-color:#E3A93B;background:var(--warn-soft)}
.badge span{font-size:26px}.badge b{font-size:14px}.badge small{font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,25,24,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}

.sheet{background:var(--surface);color:var(--fg);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .25s ease-out}

.tone-svg{width:100%;max-width:360px;height:auto;display:block}
.tl{stroke:var(--line);stroke-width:1}.tt{fill:var(--muted);font-size:10px}
.tp{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s ease-out forwards}
.good-p{stroke:var(--good)}.bad-p{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 6;animation:none;stroke-dashoffset:0;opacity:.8}
@keyframes draw{to{stroke-dashoffset:0}}
.key{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle}.good-k{background:var(--good)}.bad-k{background:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:90;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;transition:.3s;max-width:90vw;text-align:center}

@media (prefers-reduced-motion:reduce){.buddy-art,.sheet,.tp{animation:none;stroke-dashoffset:0}}
.score small{font-size:24px;color:var(--muted);margin-left:8px}

/* ===== Magical Explorer design system (single, deliberate light theme) ===== */
:root,:root[data-theme="dark"]{
  --navy:#1B2540;--jade:#3EC5B6;--jade-ink:#12756B;--lav:#8E7AF3;--pink:#FF8CA7;--gold:#F4C95D;--sage:#7DAE7A;--sand:#EBDCC3;--cream:#FFF8ED;
  --bg:#FFF8ED;--surface:#FFFDF8;--fg:#1B2540;--muted:#59627A;--line:#E9DCC5;
  --accent:#12756B;--accent-soft:#DDF5F1;--good:#3D7A3A;--good-soft:#E4F2DF;--bad:#C0395E;--bad-soft:#FFE7ED;--warn-soft:#FDF0CF;
  --display:"Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--fun:"Fredoka","Nunito",sans-serif;
  --r-card:22px;--shadow:0 6px 18px rgba(27,37,64,.09),0 1px 3px rgba(27,37,64,.06);--shadow-lift:0 12px 28px rgba(27,37,64,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#FFF8ED;--surface:#FFFDF8;--fg:#1B2540;--muted:#59627A;--line:#E9DCC5;--accent:#12756B;--accent-soft:#DDF5F1;--good:#3D7A3A;--good-soft:#E4F2DF;--bad:#C0395E;--bad-soft:#FFE7ED;--warn-soft:#FDF0CF;color-scheme:light}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.in-game{padding-bottom:32px}
body::before{opacity:1;background:radial-gradient(120% 60% at 50% -10%,#FFE9D6 0,transparent 60%),radial-gradient(60% 40% at 100% 30%,#EFE8FF 0,transparent 70%);background-size:auto}
.wrap{max-width:none}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.han{font-family:var(--han);font-weight:500}
h1,h2,h3{font-family:var(--display);font-weight:800;color:var(--navy);letter-spacing:-.01em}
.ico{width:24px;height:24px;flex:none;color:var(--navy)}
.ico.big{width:52px;height:52px}.ico.huge{width:76px;height:76px}
.small{color:var(--muted)}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding-block:8px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
.appbar-title{flex:1;font-weight:800;font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{font:inherit;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--navy);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.icon-btn .ico{width:22px;height:22px}
.icon-btn.glass{background:rgba(255,253,248,.75);border-color:rgba(255,255,255,.8);backdrop-filter:blur(6px)}
.buddy-chip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px 2px 3px;box-shadow:var(--shadow);cursor:pointer;font-variant-numeric:tabular-nums;min-height:40px}
.buddy-chip .ico{width:18px;height:18px}
.chip-xp,.chip-streak{display:flex;align-items:center;gap:3px}
.mini-panda{width:34px;height:36px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(27,37,64,.08);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));border-radius:22px 22px 0 0}
.tab-b{font:inherit;font-size:12.5px;font-weight:700;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;border-radius:14px;min-height:52px}
.tab-b .ico{color:inherit;width:26px;height:26px}
.tab-b[aria-current]{color:var(--jade-ink);background:var(--accent-soft)}

/* shared building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{display:flex;align-items:center;gap:8px;font-size:20px;margin:0}
.pbar{height:10px;border-radius:999px;background:#EFE3CD;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3EC5B6,#7FE2D7);transition:width .6s ease}
.pbar.gold i{background:linear-gradient(90deg,#F4C95D,#FFE59A)}
.pbar.g i{background:linear-gradient(90deg,#7DAE7A,#A9D3A0)}.pbar.m i{background:linear-gradient(90deg,#F4C95D,#FFE59A)}.pbar.b i{background:linear-gradient(90deg,#FF8CA7,#FFB3C4)}
.btn,.play{font:inherit;font-weight:800;background:linear-gradient(180deg,#5AD3C5,#35B9AA);color:var(--navy);border:0;border-radius:999px;padding:13px 24px;box-shadow:0 6px 14px rgba(46,174,159,.32),inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover,.play:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(46,174,159,.38)}
.btn:active,.play:active{transform:translateY(1px)}
.play svg{fill:var(--navy)}
.ghost{color:var(--jade-ink);font-weight:700}
.chip{font-weight:700;border-color:var(--line);background:var(--surface);min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--jade);background:var(--accent-soft);color:var(--jade-ink)}
.eyebrow{color:var(--jade-ink);font-weight:800}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--lav);outline-offset:2px}

/* home hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:280px;box-shadow:var(--shadow);isolation:isolate}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,248,237,0) 40%,rgba(255,248,237,.25) 100%)}
.hero-in{padding:16px;display:flex;flex-direction:column;gap:10px;height:100%}
.greet{display:flex;align-items:center;gap:12px;background:rgba(255,253,248,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;padding:10px 10px 10px 10px;box-shadow:var(--shadow)}
.greet-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.greet h1{margin:0;font-size:26px;line-height:1.1}
.greet p{margin:0;font-weight:700;color:var(--muted);font-size:14px}
.avatar{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#FFE9D6);border:3px solid #fff;box-shadow:0 0 0 3px var(--gold),var(--shadow);display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
.avatar .big-panda{width:56px;height:60px}
.avatar.big{width:110px;height:110px}.avatar.big .big-panda{width:96px;height:100px}
.countdown{align-self:flex-start;margin:auto 0 0;background:rgba(27,37,64,.78);color:#FFF8ED;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
.countdown b{color:var(--gold)}
.petals i{position:absolute;top:-10px;width:10px;height:7px;border-radius:60% 0 60% 0;background:#FFB7C9;opacity:.9;animation:petal 9s linear infinite}
.petals i:nth-child(1){left:12%;animation-delay:0s}.petals i:nth-child(2){left:30%;animation-delay:2.5s;animation-duration:11s}.petals i:nth-child(3){left:52%;animation-delay:5s}
.petals i:nth-child(4){left:70%;animation-delay:1.2s;animation-duration:12s}.petals i:nth-child(5){left:86%;animation-delay:6.5s}.petals i:nth-child(6){left:42%;animation-delay:8s;animation-duration:10s}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,320px) rotate(400deg);opacity:0}}

/* continue card */
.journey-card{display:grid;grid-template-columns:150px 1fr;background:linear-gradient(180deg,#FFFDF8,#FBF1DF);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.jc-art{position:relative;min-height:150px;isolation:isolate}
.jc-art .scene,.ss-art .scene{z-index:0}
.jc-pin{position:absolute;left:12px;top:12px;z-index:1;width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#5AD3C5,#35B9AA);color:var(--navy);font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 18px #3EC5B6}
.jc-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.jc-body h2{margin:0;font-size:21px;text-wrap:balance}
.jc-body .btn{align-self:flex-start;margin-top:4px}
@media (max-width:480px){.journey-card{grid-template-columns:1fr}.jc-art{min-height:110px}}
.scene.crop0{object-position:left}.scene.crop1{transform:scale(1.6) translate(-12%,-6%)}.scene.crop2{transform:scale(1.5) translate(14%,-4%)}

/* nav cards */
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-card{font:inherit;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFFDF8,#FBF1DF);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;min-height:96px;color:var(--navy)}
.nav-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}.nav-card:active{transform:translateY(1px) scale(.99)}
.nav-card span{display:flex;flex-direction:column;line-height:1.1}
.nav-card b{font-size:28px;font-weight:700}.nav-card em{font-style:normal;font-weight:800;font-size:16px;color:var(--muted)}

/* quests */
.quests h2 .ico{width:26px;height:26px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan-b{font:inherit;width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--navy);border-radius:16px;padding:10px 12px;cursor:pointer;position:relative}
.plan-b:hover{border-color:var(--jade)}
.plan-b .ico{width:40px;height:40px}
.plan-b span{display:flex;flex-direction:column;min-width:0}.plan-b b{font-weight:800}.plan-b small{color:var(--muted);font-size:13px}
.plan-b em{margin-left:auto;color:var(--good)}.plan-b em .ico{width:22px;height:22px;color:var(--good)}
.daily-b{width:100%;background:linear-gradient(180deg,#FFE59A,#F4C95D);box-shadow:0 6px 14px rgba(231,169,58,.3)}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-card{font:inherit;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);cursor:pointer;color:var(--navy)}
.mini-card .ico{width:40px;height:40px}.mini-card span{display:flex;flex-direction:column;min-width:0}.mini-card b{font-weight:800}.mini-card small{color:var(--muted);font-size:13px}

/* hubs */
.hub-head,.prof-head{position:relative;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow)}
.hub-in,.prof-in{display:flex;align-items:center;gap:14px;padding:22px 18px;background:linear-gradient(90deg,rgba(255,253,248,.92),rgba(255,253,248,.6))}
.hub-in h1,.prof-in h1{margin:0;font-size:30px}.hub-in p,.prof-in p{margin:2px 0 0;font-weight:600;color:var(--muted)}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gtile{font:inherit;display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(180deg,#FFFDF8,#FBF1DF);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);cursor:pointer;color:var(--navy);transition:transform .15s,box-shadow .15s;min-height:88px}
.gtile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.gtile span{display:flex;flex-direction:column;min-width:0}.gtile b{font-weight:800;font-size:18px}.gtile small{color:var(--muted);font-size:14px}

/* map */
.map-head h1{margin:0;font-size:30px}.map-head p{margin:4px 0 0;color:var(--muted);font-weight:600}
.map{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.map-bg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;transform:translate(-50%,-50%);opacity:.85;pointer-events:none}
.deco svg{width:44px;height:52px}
.stop{font:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--navy)}
.stop.left{flex-direction:row-reverse}
.stop-dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;flex:none;border:4px solid #fff;box-shadow:var(--shadow)}
.stop.done .stop-dot{background:linear-gradient(180deg,#FFE59A,#F4C95D)}.stop.done .stop-dot .ico{width:26px;height:26px;color:var(--navy)}
.stop.current .stop-dot{background:linear-gradient(180deg,#5AD3C5,#35B9AA);animation:pulse 2s ease-in-out infinite}
.stop.next .stop-dot{background:#EFE6D6;color:#8C8572}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,197,182,.55),var(--shadow)}50%{box-shadow:0 0 0 12px rgba(62,197,182,0),var(--shadow)}}
.stop-label{display:flex;flex-direction:column;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);text-align:left;max-width:150px}
.stop.left .stop-label{text-align:right}
.stop-label b{font-weight:800;font-size:15px;line-height:1.15}.stop-label .han{font-size:15px}.stop-label small{font-size:12px;color:var(--muted)}
.stop.next .stop-label{opacity:.85}

/* stop sheet */
.stop-sheet{padding:0;overflow:hidden}
.stop-sheet>*:not(.ss-art){margin-left:18px;margin-right:18px}
.ss-art{position:relative;height:130px;isolation:isolate}
.ss-x{position:absolute;right:12px;top:12px;z-index:2}
.acts{display:flex;flex-direction:column;gap:8px;margin-block:10px}
.act-b{font:inherit;display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--navy);text-align:left}
.act-b:hover{border-color:var(--jade)}.act-b .ico{width:36px;height:36px}.act-b b{flex:1;font-weight:800}
.stop-sheet>p:last-child{margin-bottom:18px}

/* collection */

function charsFor(n){const parts=n.trim().split(/\s+/).map(x=>{x=x.replace(/ü/g,"v");if(REV[x])return REV[x];if(/5$/.test(x)){const b=x.slice(0,-1);for(const t of [1,2,3,4])if(REV[b+t])return REV[b+t]}return null});return parts.every(Boolean)?parts.join(""):null}
function combine(ini,fin,t){
  fin=fin.replace(/v/g,"ü");let s;
  if(!ini||ini==="y"||ini==="w"){const yw=Object.fromEntries(YW);s=yw[fin]||fin}
  else if(["j","q","x"].includes(ini)&&fin.startsWith("ü"))s=ini+"u"+fin.slice(1);
  else s=ini+fin;
  s=s.replace(/ü/g,"v");
  for(const tt of [t,1,2,3,4])if(REV[s+tt])return s+tt;
  return null;
}
let enVoice=null;
function pickEn(){try{const v=speechSynthesis.getVoices();enVoice=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickEn();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",pickEn)}
function sayParts(parts){
  try{speechSynthesis.cancel();parts.forEach(([txt,en,rate])=>{const u=new SpeechSynthesisUtterance(txt);if(en){u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=1}else{u.lang="zh-CN";if(voice)u.voice=voice;u.rate=rate||(slow?0.55:0.75)}speechSynthesis.speak(u)})}catch(e){}
}

function cmpHTML(wrongLabel,wrongN,rightLabel,rightN,rightChars,wrongChars){
  const w=wrongChars||(wrongN&&charsFor(wrongN)),r=rightChars||(rightN&&charsFor(rightN));
  if(!r)return "";
  return `<div class="cmp" data-w="${w||""}" data-r="${r}">
    ${!wrongLabel?"":w?`<button class="cmp-b bad" data-play="w">🔊 You picked <b>${wrongLabel}</b></button>`:`<span class="small">“${wrongLabel}” isn't a real Chinese sound, so it can't be played.</span>`}
    <button class="cmp-b good" data-play="r">🔊 Right answer <b>${rightLabel}</b></button>

}
function wireCmp(root,auto){addWhy(root);
  const box=root.querySelector(".cmp");if(!box)return;const w=box.dataset.w,r=box.dataset.r;
  box.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>sayParts([[b.dataset.play==="w"?w:r,0]]));
  const both=box.querySelector(".cmp-both");
  const diff=()=>sayParts(w?[["You picked",1],[w,0,0.6],["The answer is",1],[r,0,0.6],["Again:",1],[w,0,0.6],[r,0,0.6]]:[["The answer is",1],[r,0,0.6]]);

    const up=ev=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);

function sniperStart(){
  const items=pick(SNIPE,15);const st={i:0,hits:0,t0:Date.now()};

      fb(ok,"spell");if(!ok)lastCoach={type:"rule",title:"Where the tone mark goes",html:`<p>Check the vowels in this order and put the mark on the first one you find:</p><ol><li><b>a</b>: always gets it (xi<b>ǎ</b>o, ji<b>ā</b>)</li><li><b>e</b>: always gets it (xu<b>é</b>, ji<b>ě</b>)</li><li><b>o</b> in <b>ou</b>: h<b>ò</b>u</li><li>Otherwise the <b>last</b> vowel: li<b>ù</b>, du<b>ì</b></li></ol><p>${placeRule(n)}</p>`};if(ok){st.hits++;b.textContent=right[k];b.classList.add("hit")}else{b.classList.add("miss");card.querySelectorAll(".ltr")[target].classList.add("hit");card.querySelectorAll(".ltr")[target].textContent=right[target]}

/* Real or Fake? spelling rules */
function fakeItem(){
  if(Math.random()<.5){const [s,why]=pick(INVALID,1)[0];return {s,real:false,why}}
  if(Math.random()<.4){const [f,w]=pick(YW,1)[0];return {s:w,real:true,why:`${w} is how ${f} is written with no initial.`}}
  const s=pick(VALID,1)[0];return {s,real:true,why:`${s} is a real syllable.`};
}
function fakeIntro(){introCard("Real or Fake?","A syllable appears. Is it real pinyin or a fake? Watch for y / w spelling, dots on ü, and i finals with the wrong first sounds. 3 hearts.",getBest("fake")?`Best: ${getBest("fake")}`:"",fakeStart)}
function fakeStart(){
  const st={score:0,lives:3,win:6000*P().mult,streak:0},timed=P().mult>0;
  const round=()=>{
    if(st.lives<=0)return gameOver("Game over!",`${st.score} points`,"fake",st.score,true,fakeStart);
    const it=fakeItem();
    card.innerHTML=`<div class="meta"><span>Score <b>${st.score}</b>${st.streak>2?` · 🔥${st.streak}`:""}</span><span>${"❤".repeat(st.lives)}${"♡".repeat(3-st.lives)}</span></div>
    ${timed?'<div class="bar"><i id="f-bar" style="width:100%"></i></div>':""}
    <div class="fake-card" id="f-card">${it.s}</div>
    <div class="rf"><button class="btn rf-real" id="f-real">Real</button><button class="btn rf-fake" id="f-fake">Fake</button></div><div id="after"></div>`;
    let done=false;const t0=Date.now();
    const bar=gI(()=>{const el=document.getElementById("f-bar");if(el)el.style.width=Math.max(0,100-(Date.now()-t0)/st.win*100)+"%"},50);
    const end=(ans)=>{if(done)return;done=true;clearInterval(bar);const ok=ans===it.real;
      document.getElementById("f-real").disabled=document.getElementById("f-fake").disabled=true;
      document.getElementById("f-card").classList.add(ok?"good-c":"bad-c");
      fb(ok,"spell");if(ok){st.score++;st.streak++;if(timed)st.win=Math.max(3000*P().mult,st.win*0.96)}else{st.lives--;st.streak=0}
      document.getElementById("after").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ans===null?"Too slow!":ok?"Right!":"Not quite."}</strong>${it.real?"Real. ":"Fake. "}${it.why}</div>`;
      if(ok)gT(round,P().auto+600);else nextBtn(round)};
    document.getElementById("f-real").onclick=()=>end(true);document.getElementById("f-fake").onclick=()=>end(false);
    if(timed)gT(()=>end(null),st.win);else clearInterval(bar);
  };

}

/* ---------- mistake memory ---------- */
const MKEY="mistakes";

const srcKey=s=>s.k+":"+JSON.stringify(s.d);
function logMiss(q){if(!q||!q.src)return;const a=loadMist(),key=srcKey(q.src),f=a.find(x=>srcKey(x)===key);if(f)f.c=Math.min((f.c||1)+1,3);else a.push({...q.src,c:1});saveMist(a)}
function logHit(q){if(!q||!q.src)return;const a=loadMist(),key=srcKey(q.src),f=a.find(x=>srcKey(x)===key);if(!f)return;f.c--;const rest=f.c<=0?a.filter(x=>x!==f):a;saveMist(rest);if(!rest.length)flag("troubleCleared")}

/* ---------- Dictation Dash with one- and two-syllable words ---------- */
function dashItem(){if(DASH_POOL)return pick(DASH_POOL,1)[0];
  if(Math.random()<.5){const [c,n]=pick(DICT,1)[0];return {c,n,m:""}}
  const [c,n,m]=pick(WORDS.filter(w=>w[0].length===2&&w[1].split(" ").length===2),1)[0];return {c,n,m};
}
function dashStart(){
  const st={score:0,lives:3,streak:0};
  const round=()=>{
    if(st.lives<=0)return gameOver("Game over!",`${st.score} written right`,"dash",st.score,true,dashStart);
    const it=dashItem(),syl=it.n.split(" "),multi=syl.length>1,tones=syl.map(()=>0);let done=false;
    const q={src:{k:"word",d:[it.c,it.n,it.m]}};
    card.innerHTML=`<div class="meta"><span>Score <b>${st.score}</b>${st.streak>2?` · 🔥${st.streak}`:""}</span><span>${"❤".repeat(st.lives)}${"♡".repeat(3-st.lives)}</span></div>
    <div class="listen"><button class="play" id="play-btn">${SPK}Hear it</button><label class="slow"><input type="checkbox" id="slow-box" ${slow?"checked":""}> Slower</label></div>
    <p class="small">${multi?`A two-syllable word${it.m?` (“${it.m}”)`:""}. Write each syllable and its tone.`:"One syllable. Write it and pick its tone."} Type <b>v</b> for ü.</p>
    ${syl.map((_,j)=>`<div class="syl"><input class="dict-in" id="dict-in-${j}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${multi?`syllable ${j+1}`:"type the letters"}" aria-label="Syllable ${j+1}">
      <div class="tones">${[1,2,3,4].map(t=>`<button class="tone-b" data-j="${j}" data-t="${t}" aria-pressed="false"><b>${["ā","á","ǎ","à"][t-1]}</b><span>tone ${t}</span></button>`).join("")}${multi?`<button class="tone-b" data-j="${j}" data-t="5" aria-pressed="false"><b>a</b><span>neutral</span></button>`:""}</div></div>`).join("")}
    <div class="row"><span></span><button class="btn" id="check-btn">Check</button></div><div id="after"></div>`;
    say(it.c);document.getElementById("play-btn").onclick=()=>say(it.c);
    document.getElementById("slow-box").onchange=e=>{slow=e.target.checked};
    card.querySelectorAll(".tone-b").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;tones[j]=+b.dataset.t;card.querySelectorAll(`.tone-b[data-j="${j}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"))});
    const check=()=>{if(done)return;const after=document.getElementById("after");
      const got=syl.map((_,j)=>{const r=parseIn(document.getElementById("dict-in-"+j).value);return {l:r.letters,t:tones[j]||r.tone}});
      if(got.some(g=>!g.l)){after.innerHTML=`<p class="small">Type the letters for every syllable first.</p>`;return}
      if(got.some(g=>!g.t)){after.innerHTML=`<p class="small">Now pick a tone for every syllable.</p>`;return}
      done=true;
      const res=syl.map((s,j)=>{const want=s.slice(0,-1).replace(/v/g,"ü"),wt=+s.slice(-1);return {want,wt,lok:got[j].l===want,tok:got[j].t===wt||(wt===5&&got[j].t===5),s}});
      const ok=res.every(r=>r.lok&&r.tok),py=markAll(it.n);
      const yn0=got.map(g=>g.l.replace(/ü/g,"v")+g.t).join(" ");fb(ok,"dict",{src:q.src,n:it.n,typed:yn0,say:it.c},-1);if(ok){st.score++;st.streak++;logHit(q);if(st.score>=10)flag("dash10")}else{st.lives--;st.streak=0;logMiss(q)}
      const yn=got.map(g=>g.l.replace(/ü/g,"v")+g.t).join(" ");
      const notes=res.filter(r=>!(r.lok&&r.tok)).map(r=>`<li><b>${mark(r.s)}</b>: ${!r.lok?`letters should be <b>${r.want}</b>. ${jqxNote(r.want,got[res.indexOf(r)].l)}`:""} ${!r.tok?(r.wt===5?"this syllable has no tone mark (neutral).":`tone ${r.wt}. ${placeRule(r.s)}`):""}</li>`).join("");
      after.innerHTML=`<div class="feedback ${ok?"good":"bad"}"><strong>${ok?"Yes!":"Not quite."}</strong><b class="big">${py}</b> <span class="han">${it.c}</span>${it.m?` · “${it.m}”`:""}${ok?"":`<ul class="fixes">${notes}</ul>${cmpHTML(markAll(yn),yn,py,it.n,it.c)}`}</div>
      <div class="row" style="margin-top:12px"><span></span><button class="btn" id="next-btn">Next</button></div>`;
      if(!ok)wireCmp(after,true);
      const nb=document.getElementById("next-btn");nb.focus({preventScroll:true});nb.onclick=round;};
    card.querySelectorAll(".dict-in").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter"){const nb=document.getElementById("next-btn");if(nb)nb.click();else check()}});
    document.getElementById("check-btn").onclick=check;
    try{document.getElementById("dict-in-0").focus({preventScroll:true})}catch(e){}
  };
  round();
}

    const notes={ok:[[880,0,.12],[1320,.1,.16]],bad:[[330,0,.18],[220,.14,.22]],win:[[523,0,.14],[659,.12,.14],[784,.24,.14],[1047,.36,.3]],level:[[659,0,.12],[880,.1,.12],[1175,.2,.3]]}[kind]||[];
    notes.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);

function jqxNote(want,got){
  const wi=initOf(want),gi=initOf(got);
  if(wi==="q"&&["ch","g","c","k"].includes(gi))return "q sounds a bit like the “ch” in “cheese,” but it's written <b>q</b>.";
  if(wi==="x"&&["sh","s"].includes(gi))return "x sounds a bit like the “sh” in “sheep,” but it's written <b>x</b>.";
  if(wi==="j"&&["zh","z","g"].includes(gi))return "j sounds like the “j” in “jeep,” and it's written <b>j</b>.";
  if(/^[jqxy]u/.test(want)&&/ü/.test(got))return "After j, q, x, y the ü is written as plain u.";
  return "";
}

  else if(toneOK)msg=`<strong>Tone right, letters wrong.</strong>It's <b class="big">${q.py}</b>, not ${letters}. ${jqxNote(want,letters)}`;
  else msg=`<strong>Not quite.</strong>It's <b class="big">${q.py}</b> (tone ${wantT}). ${jqxNote(want,letters)} ${placeRule(q.n)}`;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const PP=window.pinyinPro;
const DIG=["零","一","二","三","四","五","六","七","八","九"];
function numToHan(s){return s.replace(/\d+/g,n=>{n=+n;if(n<10)return DIG[n];if(n<20)return "十"+(n%10?DIG[n%10]:"");if(n<100)return DIG[Math.floor(n/10)]+"十"+(n%10?DIG[n%10]:"");return String(n)})}
function sylls(t){if(!PP)return[];t=numToHan(t).replace(/[^一-鿿]/g,"");return t?PP.pinyin(t,{toneType:"none",type:"array",v:true}):[]}
function toneMarked(t){if(!PP)return"";t=numToHan(t).replace(/[^一-鿿]/g,"");return t?PP.pinyin(t):""}
function lcs(a,b){const d=Array(b.length+1).fill(0);for(const x of a){let prev=0;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=x===b[j-1]?prev+1:Math.max(d[j],d[j-1]);prev=t}}return d[b.length]}
function phraseScore(heard,target){const t=sylls(target);return t.length?lcs(sylls(heard),t)/t.length:0}
function matches(heard,target){const h=sylls(heard).join(" "),tg=sylls(target).join(" ");return !!tg&&(" "+h+" ").includes(" "+tg+" ")}
let speakSet="phrases",slist=[],si=0,sscore=0;
const SPEAK={
  phrases:()=>shuffle(PHRASES).map(p=>({...p,phrase:true})),
  poem:()=>poemItems(),
  recite:()=>reciteItems(),
  finals:()=>pick(FINALS,30).map(([c,n,f])=>({say:c,py:mark(n),note:`final <b>${f}</b>${NOTES[f]?" · "+NOTES[f]:""}`})),
  initials:()=>pick(INITIALS,30).map(([c,n])=>({say:c,py:mark(n),note:`initial <b>${initOf(n)}</b>`})),
  tones:()=>pick(TONES,20).map(([c,n])=>({say:c,py:mark(n),note:`tone <b>${n.slice(-1)}</b>`})),
  words:()=>pick(WORDS,36).map(([c,n,m])=>({say:c,py:markAll(n),note:`<span class="han">${c}</span> · “${m}”`}))

function startSpeak(set){speakSet=set;slist=SPEAK[set]();si=0;sscore=0;renderSay()}
let rec=null,listening=false,mediaRec=null,myClip=null;
function renderSay(){
  const q=slist[si];q._ok=false;
  card.innerHTML=`<div class="meta"><span>Item ${si+1} of ${slist.length}</span><span>Said right ${sscore}</span></div>

  ${q.say?`<div class="listen"><button class="play" id="play-btn">${SPK}Hear it</button>
  <label class="slow"><input type="checkbox" id="slow-box" ${slow?"checked":""}> Slower</label></div>`:""}

  ${q.noMic?`<div class="listen"><button class="btn" id="self-yes">I got them all ✓</button><button class="ghost" id="self-no">Not yet</button></div>`:`<div class="listen"><button class="mic" id="mic-btn">${MIC}<span>Tap, then speak</span></button></div>`}
  <div class="listen"><button class="ghost" id="rec-btn">Record myself (${q.long?15:q.phrase?6:3} sec)</button><button class="ghost" id="me-btn" hidden>Play my recording</button></div>

  const pbb=document.getElementById("play-btn");if(pbb){pbb.onclick=()=>say(q.say);document.getElementById("slow-box").onchange=e=>{slow=e.target.checked}}

    document.getElementById("self-no").onclick=()=>{reveal(q);document.getElementById("after").innerHTML=`<div class="feedback bad"><strong>Here they are.</strong>Read them out loud twice, then try again from memory.</div>`}}

function reveal(q){const r=document.getElementById("reveal");if(r)r.innerHTML=`<div class="py-line">${q.py}</div>${q.zh?`<div class="small han">${q.zh}</div>`:""}`}
function stopAll(){try{rec&&rec.abort()}catch(e){}try{mediaRec&&mediaRec.state==="recording"&&mediaRec.stop()}catch(e){}listening=false}
function startClip(ms){
  myClip=null;const rb=document.getElementById("rec-btn");if(rb)rb.textContent="Recording… speak now";
  if(!navigator.mediaDevices||!window.MediaRecorder)return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    const ch=[];mediaRec=new MediaRecorder(st);

    mediaRec.start();setTimeout(()=>{try{mediaRec.state==="recording"&&mediaRec.stop()}catch(e){}},ms||3000);

function listenTo(q){
  const after=document.getElementById("after"),mb=document.getElementById("mic-btn");
  if(!SR){after.innerHTML=`<div class="feedback bad"><strong>This browser can't listen.</strong>Open this page in Google Chrome or Microsoft Edge on a computer.</div>`;return}
  if(!PP){after.innerHTML=`<div class="feedback bad"><strong>Checker didn't load.</strong>Reload the page and try again.</div>`;return}
  if(listening){stopAll();return}
  try{speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang="zh-CN";rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  listening=true;mb.classList.add("on");mb.querySelector("span").textContent="Listening… speak now";
  after.innerHTML=`<p class="small">Say it clearly, then stop talking. The result appears a second later.</p>`;
  let gotFinal=false,lastAlts=[],errShown=false;
  const judge=alts=>{
    alts=alts.filter(Boolean);if(!alts.length)return false;
    const best=q.phrase?Math.max(...alts.map(a=>phraseScore(a,q.say))):0;
    const ok=q.phrase?best>=(q.need||0.8):alts.some(a=>matches(a,q.say));
    if(q.phrase){
      if(ok&&!q._ok){fb(true,"speak");q._ok=true;sscore++;card.querySelector(".meta span:last-child").textContent="Said right "+sscore}
      reveal(q);
      after.innerHTML=ok?`<div class="feedback good"><strong>${yes[si%yes.length]}</strong>It understood your sentence. Compare your tones with “Hear it.”</div>`
        :`<div class="feedback bad"><strong>Almost.</strong>It heard: <span class="han">${alts[0]}</span> (${toneMarked(alts[0])}). It got about ${Math.round(best*100)}% of the sentence. Press “Hear it,” then try again.</div>`;
      return true;
    }
    const top=alts[0]||"";const topPy=toneMarked(top)||top;
    if(ok&&!q._ok){fb(true,"speak");q._ok=true;sscore++;card.querySelector(".meta span:last-child").textContent="Said right "+sscore}
    after.innerHTML=ok
      ?`<div class="feedback good"><strong>${yes[si%yes.length]}</strong>It heard <b>${q.py}</b>. That's the right sound. (It can't check tones, so compare with “Hear it.”)</div>`
      :`<div class="feedback bad"><strong>Try again.</strong>It heard <span class="han">${top}</span> <b>${topPy}</b> instead of <b>${q.py}</b>. Press “Hear it,” copy the sound, and try once more.</div>`;
    return true;
  };
  rec.onresult=e=>{const r=e.results[e.results.length-1];const alts=[...r].map(a=>a.transcript.trim());lastAlts=alts;if(r.isFinal){gotFinal=true;judge(alts)}};
  rec.onerror=e=>{
    const msg=e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked. Click the microphone or lock icon in the address bar, allow the microphone, and try again."
      :e.error==="no-speech"?"It didn't hear anything. Tap the button, then speak right away, a little louder."
      :e.error==="network"?"The listening service needs an internet connection."
      :e.error==="aborted"?"":"Something went wrong ("+e.error+"). Tap the button and try again.";
    if(msg){errShown=true;after.innerHTML=`<div class="feedback bad"><strong>Not heard.</strong>${msg}</div>`}
  };
  rec.onend=()=>{listening=false;mb.classList.remove("on");mb.querySelector("span").textContent="Tap, then speak";
    if(!gotFinal&&!errShown&&!judge(lastAlts))after.innerHTML=`<div class="feedback bad"><strong>It didn't catch that.</strong>Short sounds are hard for it. Tap the microphone and say it two times in a row, a little louder and slower.</div>`;
  };
  try{rec.start()}catch(e){listening=false}
}

function poemPuzzle(){openGame("poem","Poem Puzzle · 咏鹅","Unscramble each line of the goose poem, just like the class worksheet. Tap letters in order; tap a filled box to undo.");

    const [words,en,zh]=POEM_FRAG[f],letters=shuffle(words.join("").split("").map((c,j)=>({c,j}))),slots=words.map(w=>Array(w.length).fill(null));

      card.querySelectorAll(".pp-tile").forEach(b=>b.onclick=()=>{const x=letters.find(l=>l.j===+b.dataset.j);for(const w of slots){const k=w.indexOf(null);if(k>=0){w[k]=x;break}}draw();

      card.querySelectorAll(".pp-slot").forEach(b=>b.onclick=()=>{slots[+b.dataset.w][+b.dataset.s]=null;draw()});};
    draw();};
  round();}

function rhymeRecall(){hubBack="v-hub";lastHub="review";openGame("review","Rhyme recall","Finish the line. Rhymes make the rules stick.");
  const all=CH.flatMap(c=>c.rhymes.map(r=>({c,r})));const ends=[...new Set(all.flatMap(({r})=>r.lines.map(l=>l.replace(/[^\p{L}\s’'-]/gu,"").trim().split(/\s+/).pop().toLowerCase())))];
  list=shuffle(all).slice(0,8).map(({c,r})=>{const k=Math.floor(Math.random()*r.lines.length),line=r.lines[k],m=line.match(/([\p{L}’'-]+)([^\p{L}]*)$/u),w=m[1],wl=w.toLowerCase();
    return {noAudio:true,kind:"review",prompt:`<span class="small">${r.name}</span><br><span class="rh-lines">${r.lines.map((l,j)=>j===k?l.slice(0,m.index)+'<span class="gap">?</span>'+m[2]:l).join("<br>")}</span>`,
      opts:shuffle([wl,...pick(ends.filter(e=>e!==wl),3)]).map(t=>({t,ok:t===wl})),ex:`${line}<br><span class="small">From the chapter “${c.title}”.</span>`}});
  i=0;score=0;missed=[];sec="rhyme";rerun=rhymeRecall;afterFinish=()=>gameDone("review",5);render()}

function openVid([id,t]){try{speechSynthesis.cancel()}catch(e){}const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="sheet vid-sheet" role="dialog" aria-modal="true" aria-label="${t}"><div class="row"><b>${t}</b><button class="ghost" id="vd-x" aria-label="Close">✕</button></div>
  <div class="vid-box"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" title="${t}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
  <p class="small">Won't play here? <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open it on YouTube</a>. Found online, not made for this site.</p></div>`;
  document.body.appendChild(m);const close=()=>m.remove();m.onclick=e=>{if(e.target===m)close()};m.querySelector("#vd-x").onclick=close}
const SIB={b:"d p q",d:"b p q",p:"b d q",q:"b d p",m:"n h",n:"m h",h:"n m",f:"t l",t:"f l",l:"t f",g:"q j",j:"g q",z:"s c",s:"z c",c:"z s",x:"k",k:"x h",r:"f",a:"o e",o:"a u",e:"a o",i:"ü u",u:"ü o","ü":"u i"};
function rhymeLearn(k,start){const S=RHY[k];openGame("rhyme",`${S.name} · Learn it`,S.intro);afterFinish=null;rerun=null;let at=start||0;
  const draw=()=>{const L=S.lines[at];
    card.innerHTML=`<div class="lesson">
     <div class="ls-stage"><div class="ls-dots">${S.lines.map((_,j)=>`<i class="${j<=at?"on":""}"></i>`).join("")}</div>
      <div class="ls-big">${L.big||"♪"}</div><div class="ls-py">${L.py}</div><div class="ls-en">${L.en}</div><span class="small han">${L.zh}</span></div>
     <div class="row"><button class="ghost" id="ls-back" ${at?"":"disabled"}>← Back</button><button class="btn" id="ls-say">🔊 Say it</button><button class="ghost" id="ls-next">${at<S.lines.length-1?"Next →":"Done ✓"}</button></div>
     <p class="ls-note">Say it back after the voice, like an echo. Then chant the whole rhyme.</p>
     <div class="row"><button class="ghost" id="ls-all">🔊 Chant the whole rhyme</button><button class="btn" id="ls-play">Play the game →</button></div>
     ${(RVID[S.id]||[]).length?`<div class="row ls-vids">${RVID[S.id].map(([v,t],j)=>`<button class="ghost" data-vid="${j}">▶ Watch: ${t}</button>`).join("")}</div>`:""}
     <div class="ls-all">${S.lines.map((l,j)=>`<button class="ls-line ${j===at?"on":""}" data-j="${j}"><b>${l.big||"♪"}</b><span><em>${l.py}</em><small>${l.en}</small></span></button>`).join("")}</div>
     <p class="ls-note">Classic rhymes from Chinese first grade. Wording varies a little between schools and textbooks.</p></div>`;
    const sayL=()=>sayParts([[L.say,0,slow?0.55:0.7]]);
    document.getElementById("ls-say").onclick=sayL;
    document.getElementById("ls-back").onclick=()=>{at--;draw();sayParts([[S.lines[at].say,0,0.7]])};
    document.getElementById("ls-next").onclick=()=>{if(at<S.lines.length-1){at++;draw();sayParts([[S.lines[at].say,0,0.7]])}else rhymeGame(k)};
    document.getElementById("ls-all").onclick=()=>sayParts(S.lines.map(l=>[l.say,0,0.7]));
    document.getElementById("ls-play").onclick=()=>rhymeGame(k);
    card.querySelectorAll("[data-vid]").forEach(b=>b.onclick=()=>openVid(RVID[S.id][+b.dataset.vid]));
    card.querySelectorAll(".ls-line").forEach(b=>b.onclick=()=>{at=+b.dataset.j;draw();sayParts([[S.lines[at].say,0,0.7]])});};
  draw();setTimeout(()=>sayParts([[S.lines[at].say,0,0.7]]),300);}
function rhymeQ(S,L){
  const answers=[...new Set(S.lines.map(l=>l.ans).filter(Boolean))];
