<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Studies Quest</title>
<meta name="theme-color" content="#2bb3a3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --head:"Baloo 2", Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg:#fff8ec; --paper:#fffdf8; --ink:#2d2a4a; --soft:#6b6789; --line:#eadfcb;
  --teal:#2bb3a3; --coral:#ff6f61; --lav:#8e7cc3; --sun:#ffc857; --sky:#5aa9e6; --pink:#ff8fb1;
  --ok:#2e9e5b; --okbg:#e3f6ea; --bad:#d9534f; --badbg:#fde8e7;
  --r:18px; --shadow:0 3px 0 rgba(45,42,74,.12), 0 8px 22px rgba(45,42,74,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(circle at 10% 0%, #ffe9f0 0, transparent 40%) no-repeat, var(--bg);
  color:var(--ink); font-family:Nunito, system-ui, -apple-system, Segoe UI, sans-serif; font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent; min-height:100vh}
h1,h2,h3{font-family:var(--head); line-height:1.15; margin:.2em 0 .4em}
h1{font-size:1.7rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
.wrap{max-width:680px; margin:0 auto; padding:0 16px 90px}
.top{position:sticky; top:0; z-index:20; background:rgba(255,248,236,.94); backdrop-filter:blur(6px); border-bottom:2px dashed var(--line)}
.top .bar{max-width:680px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.top .back{font-weight:800; font-size:.95rem; text-decoration:none; padding:6px 10px; border-radius:999px; background:#fff; box-shadow:var(--shadow); white-space:nowrap}
.top .pts{margin-left:auto; display:flex; gap:8px; font-weight:800; font-size:.95rem}
.chip{display:inline-flex; align-items:center; gap:4px; background:#fff; padding:5px 10px; border-radius:999px; box-shadow:var(--shadow); white-space:nowrap}
.card{background:var(--paper); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:14px 0; border:2px solid #fff}
.hero{position:relative; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); margin:14px 0}
.hero img{display:block; width:100%; height:auto}
.hero.home img{height:190px; object-fit:cover; object-position:center 78%}
.hero .over{position:absolute; inset:auto 0 0 0; padding:14px 16px; color:#fff; background:linear-gradient(transparent, rgba(30,25,60,.82))}
.hero h1{margin:0; text-shadow:0 2px 6px rgba(0,0,0,.4)}
.count{display:flex; gap:12px; align-items:center}
.count .big{font-family:var(--head); font-size:2.6rem; font-weight:800; color:var(--coral); line-height:1}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:14px 12px; text-align:left; display:flex; flex-direction:column; gap:2px; min-height:96px; border:2px solid transparent; transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:1.7rem}
.tile b{font-family:var(--head); font-size:1.08rem}
.tile small{color:var(--soft); font-size:.82rem; line-height:1.25}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:14px; font-weight:800; background:var(--teal); color:#fff; box-shadow:0 3px 0 #1d8679; min-height:48px}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #1d8679}
.btn.alt{background:#fff; color:var(--ink); box-shadow:0 3px 0 var(--line)}
.btn.coral{background:var(--coral); box-shadow:0 3px 0 #c9483c}
.btn.lav{background:var(--lav); box-shadow:0 3px 0 #6a5aa0}
.btn.full{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:flex-end}
.muted{color:var(--soft)}
.small{font-size:.88rem}
.say{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:#fff; box-shadow:var(--shadow); font-size:1rem; vertical-align:middle; flex:none}
.opt{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin:8px 0; font-weight:600; min-height:50px}
.opt.sel{border-color:var(--lav); background:#f3f0fb}
.opt.right{border-color:var(--ok); background:var(--okbg)}
.opt.wrong{border-color:var(--bad); background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px; padding:12px 14px; margin:10px 0; font-size:.97rem}
.fb.ok{background:var(--okbg); border-left:6px solid var(--ok)}
.fb.no{background:var(--badbg); border-left:6px solid var(--bad)}
.prog{height:10px; background:#f1e6d2; border-radius:999px; overflow:hidden; margin:6px 0 10px}
.prog i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--sky)); border-radius:999px; transition:width .3s}
.tag{display:inline-block; font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:999px; color:#fff}
.pill{display:inline-block; padding:8px 12px; margin:4px; border-radius:999px; background:#fff; box-shadow:var(--shadow); font-weight:700; font-size:.92rem}
.pill.on{background:var(--lav); color:#fff}
input[type=text], textarea{width:100%; font:inherit; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--ink)}
input[type=text]:focus, textarea:focus{outline:none; border-color:var(--lav)}
textarea{min-height:110px; resize:vertical}
/* flashcard */
.flip{perspective:1000px; margin:12px 0}
.flip .in{position:relative; min-height:230px; transition:transform .45s; transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--r); box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px}
.flip .f{background:linear-gradient(135deg,#fff,#fff3dc)}
.flip .b{background:linear-gradient(135deg,#f3f0fb,#fff); transform:rotateY(180deg)}
.flip .term{font-family:var(--head); font-size:1.6rem; font-weight:800}
/* matching */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.m{background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; min-height:58px; font-weight:700; font-size:.9rem; text-align:left; line-height:1.25}
.m.sel{border-color:var(--lav); background:#f3f0fb}
.m.done{border-color:var(--ok); background:var(--okbg); opacity:.55}
.m.shake{animation:shake .35s; border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mem{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.mt{aspect-ratio:1/1.05; border-radius:12px; background:linear-gradient(135deg,var(--lav),var(--sky)); color:#fff; font-weight:800; font-size:.8rem; line-height:1.2; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; box-shadow:var(--shadow)}
.mt.open{background:#fff; color:var(--ink); border:2px solid var(--line)}
.mt.done{background:var(--okbg); color:var(--ink); border:2px solid var(--ok)}
.mt .q{font-size:1.6rem}
/* sort/order */
.bucket{display:block; width:100%; margin:6px 0; padding:12px; border-radius:14px; font-weight:800; color:#fff; text-align:left; box-shadow:var(--shadow); min-height:48px}
.item{font-family:var(--head); font-size:1.35rem; font-weight:800; text-align:center; padding:22px 12px; background:#fff; border-radius:var(--r); box-shadow:var(--shadow); border:3px dashed var(--sun)}
.ord{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; font-weight:700; min-height:48px}
.ord .n{width:28px; height:28px; border-radius:50%; background:var(--sun); display:flex; align-items:center; justify-content:center; flex:none; font-weight:800}
.ord.right{border-color:var(--ok); background:var(--okbg)} .ord.wrong{border-color:var(--bad); background:var(--badbg)}
.ord .d{margin-left:auto; color:var(--soft); font-size:.85rem; white-space:nowrap}
/* misc */
.badge{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:#fff; margin:8px 0; box-shadow:var(--shadow)}
.badge .e{font-size:1.9rem; width:44px; text-align:center} .badge.off{opacity:.4; filter:grayscale(1)}
.plan ol{list-style:none; padding:0; margin:0}
.plan li{margin:4px 0}
.plan button{display:block; width:100%; padding:8px 0; font-weight:800; text-decoration:underline; text-decoration-color:var(--coral); text-underline-offset:3px; text-align:left}
.rhyme{white-space:pre-line; font-family:var(--head); font-size:1.1rem; background:#fff7e0; border-radius:14px; padding:12px 14px; border-left:6px solid var(--sun)}
.kind{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px; background:#eee}
.kind.classic{background:#dff1ff; color:#21629b} .kind.original{background:#ffe5ef; color:#a2305d}
ul.facts{padding-left:20px} ul.facts li{margin:6px 0}
.bars .b{margin:8px 0} .bars .lbl{display:flex; justify-content:space-between; font-weight:700; font-size:.92rem}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font-weight:800; box-shadow:0 8px 24px rgba(0,0,0,.25); transition:transform .35s; z-index:50; max-width:92vw; text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.pop{position:fixed; pointer-events:none; font-size:1.6rem; z-index:60; animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translateY(-120px) rotate(30deg); opacity:0}}
.timer{font-family:var(--head); font-weight:800; font-size:1.2rem}
.sel-topics{display:flex; flex-wrap:wrap; margin:0 -4px}
details summary{cursor:pointer; font-weight:800}
.note{font-size:.85rem; background:#fff3cd; border-radius:10px; padding:8px 10px; margin:6px 0}
@media (min-width:560px){ .grid{grid-template-columns:1fr 1fr 1fr} .mem{grid-template-columns:repeat(4,1fr)} }
</style>
</head>

<div class="top"><div class="bar" id="bar"></div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

/* ===================== ENGINE ===================== */
(function(){
"use strict";
const KEY_P = "socialstudies-progress", KEY_M = "socialstudies-mistakes", KEY_S = "socialstudies-settings";
const app = document.getElementById("app"), bar = document.getElementById("bar");

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const $ = (s, el) => (el || app).querySelector(s);
const $$ = (s, el) => Array.from((el || app).querySelectorAll(s));
const tag = t => `<span class="tag" style="background:${TOPIC[t].color}">${TOPIC[t].emoji} ${esc(TOPIC[t].name)}</span>`;
const sayBtn = text => `<button class="say" data-say="${esc(strip(text))}" aria-label="Read aloud">🔊</button>`;
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^the /,""); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
/* returns "exact" | "close" | false */
function check(input, answers){
  const x = norm(input); if (!x) return false;
  let close = false;
  for (const a of answers) { const y = norm(a); if (x === y) return "exact"; if (/^\d+$/.test(y)) continue; const tol = y.length <= 5 ? 1 : 2; if (lev(x, y) <= tol) close = true; }
  return close ? "close" : false;
}

/* ---------- storage (all keys start with "socialstudies-") ---------- */
function load(k, d){ try { const v = localStorage.getItem(k); if (v) return Object.assign(d, JSON.parse(v)); } catch(e){} return d; }
const S = load(KEY_P, {points:0, streak:0, lastDay:null, badges:{}, box:{}, stats:{}, chapters:{}, tests:[], flips:0, cleared:0, days:0});
const M = load(KEY_M, {});
const SET = load(KEY_S, {timer:false, frontDef:false});
function save(){ try { localStorage.setItem(KEY_P, JSON.stringify(S)); localStorage.setItem(KEY_M, JSON.stringify(M)); localStorage.setItem(KEY_S, JSON.stringify(SET)); } catch(e){} }

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){ try { const v = speechSynthesis.getVoices(); voice = v.find(x => /en-US/i.test(x.lang) && /female|samantha|google us/i.test(x.name)) || v.find(x => /en-US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; } catch(e){} }
if ("speechSynthesis" in window) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){} }
function speak(t){ try { if (!("speechSynthesis" in window)) return toast("Read-aloud isn’t available on this browser"); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/_{2,}/g," blank ").replace(/→/g," to ")); u.lang = "en-US"; u.rate = .93; if (voice) u.voice = voice; speechSynthesis.speak(u); } catch(e){} }
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say); } }, true);

/* ---------- points, streak, badges ---------- */
const LEVELS = [[0,"Deckhand"],[100,"Lookout"],[250,"Map Reader"],[450,"Navigator"],[700,"First Mate"],[1000,"Captain"],[1400,"Explorer"],[1900,"Historian"],[2500,"Legend"]];
function level(){ let i = 0; LEVELS.forEach((l, k) => { if (S.points >= l[0]) i = k; }); const next = LEVELS[i+1]; return {n:i+1, name:LEVELS[i][1], next:next ? next[0] : null, from:LEVELS[i][0]}; }
const BADGES = [
  ["first","🌟","First Steps","Finish any activity"],
  ["streak3","🔥","On Fire","3-day study streak"],
  ["streak7","☄️","Unstoppable","7-day study streak"],

  ["match","🧩","Matchmaker","Finish a Match-Up"],
  ["memory","🧠","Memory Master","Finish a Memory game"],
  ["sorter","🗂️","Super Sorter","Sort a whole set with no mistakes"],
  ["timeline","⏳","Time Traveler","Put a timeline in perfect order"],
  ["speedy","⚡","Lightning","12+ right in a Speed Round"],
  ["typist","⌨️","Spelling Star","Type 10 answers right in a row"],
  ["trouble10","🛠️","Trouble Crusher","Fix 10 Trouble Spots"],

  ["tester","📝","Test Ready","Finish a Practice Test"],
  ["ace","🏆","Ace","Score 80%+ on a Practice Test’s multiple choice"],
  ["pts1000","💎","Treasure Chest","Earn 1,000 points"]
];
function award(id){ if (S.badges[id]) return; S.badges[id] = Date.now(); save(); const b = BADGES.find(x => x[0] === id); if (b) { toast(`${b[1]} New badge: ${b[2]}!`); confetti(); } }
function addPts(n){ const before = level().n; S.points += n; if (S.points >= 1000) award("pts1000"); if (level().n > before) setTimeout(() => toast(`⬆️ Level up! You’re a ${level().name}!`), 900); save(); drawBar(); }
function todayStr(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function touchDay(){ const t = todayStr(); if (S.lastDay === t) return; const y = new Date(); y.setDate(y.getDate() - 1); S.streak = (S.lastDay === todayStr(y)) ? S.streak + 1 : 1; S.lastDay = t; S.days++; if (S.streak >= 3) award("streak3"); if (S.streak >= 7) award("streak7"); save(); }
function finished(){ touchDay(); award("first"); }
function record(t, ok, key){ if (t) { const st = S.stats[t] || (S.stats[t] = {r:0, n:0}); st.n++; if (ok) st.r++; } if (ok) addPts(10); else if (key) { const m = M[key] || (M[key] = {n:0, t:t}); m.n++; m.at = Date.now(); } touchDay(); save(); }
function clearMistake(key){ if (M[key]) { delete M[key]; S.cleared++; if (S.cleared >= 10) award("trouble10"); save(); } }

/* ---------- UI bits ---------- */
let toastT;
function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }
function confetti(){ const em = ["⭐","🎉","🧭","⛵","🌟","💫"]; for (let i = 0; i < 14; i++) { const s = document.createElement("span"); s.className = "pop"; s.textContent = em[i % em.length]; s.style.left = (10 + Math.random() * 80) + "vw"; s.style.top = (55 + Math.random() * 30) + "vh"; s.style.animationDelay = (Math.random() * .3) + "s"; document.body.appendChild(s); setTimeout(() => s.remove(), 1400); } }
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; try { speechSynthesis.cancel(); } catch(e){} }
function drawBar(home){
  const L = level();
  bar.innerHTML = (home ? `<a class="back" href="index.html">← All subjects</a>` : `<button class="back" id="homeBtn">← Home</button>`) +
    `<div class="pts"><span class="chip" title="Points">⭐ ${S.points}</span><span class="chip" title="Daily streak">🔥 ${S.streak}</span></div>`;
  const hb = document.getElementById("homeBtn"); if (hb) hb.onclick = home_;
}
function page(html, isHome){ clearTimers(); drawBar(isHome); app.innerHTML = html; window.scrollTo(0, 0); }
function daysLeft(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((TEST_DATE - t) / 86400000); }
function topicPicker(id, withAll){ return `<div class="sel-topics" id="${id}">${withAll ? `<button class="pill on" data-t="all">🌈 Everything</button>` : ""}${TOPICS.map((t, i) => `<button class="pill${!withAll && i === 0 ? " on" : ""}" data-t="${t.id}">${t.emoji} ${esc(t.name)}</button>`).join("")}</div>`; }
function bindPicker(id, cb){ $$(`#${id} .pill`).forEach(b => b.onclick = () => { $$(`#${id} .pill`).forEach(x => x.classList.remove("on")); b.classList.add("on"); cb && cb(b.dataset.t); }); return () => $(`#${id} .pill.on`).dataset.t; }
function acc(t){ const s = S.stats[t]; return s && s.n ? s.r / s.n : null; }
function weakest(){
  const tried = TOPICS.filter(t => S.stats[t.id] && S.stats[t.id].n >= 3).sort((a, b) => acc(a.id) - acc(b.id));
  const untried = TOPICS.filter(t => !S.stats[t.id] || S.stats[t.id].n < 3);
  if (tried.length && acc(tried[0].id) < .8) return tried[0];
  if (untried.length) return untried[0];
  return tried[0] || TOPICS[0];
}

/* ---------- question builders ---------- */
function cardQ(c, dir){
  const pool = CARDS.filter(x => x.id !== c.id);
  const same = shuffle(pool.filter(x => x.t === c.t)), other = shuffle(pool.filter(x => x.t !== c.t));
  const ds = same.concat(other).slice(0, 3);
  if (dir === "term") {
    const opts = shuffle([c].concat(ds));
    return {q:`Which term matches this?<br><i>“${esc(c.def)}”</i>`, say:c.def, o:opts.map(x => x.term), a:opts.indexOf(c), t:c.t, key:"c:" + c.id,
      why:`<b>${esc(c.term)}</b>: ${esc(c.def)}`, no:opts.map(x => x === c ? null : `${x.term} means: ${x.short}.`)};
  }
  const opts = shuffle([c].concat(ds));
  return {q:`What best describes <b>${esc(c.term)}</b>?`, say:c.term, o:opts.map(x => x.short), a:opts.indexOf(c), t:c.t, key:"c:" + c.id,
    why:`<b>${esc(c.term)}</b>: ${esc(c.def)}`, no:opts.map(x => x === c ? null : `That describes ${x.term}.`)};
}
function quizQ(q){ const idx = shuffle(q.o.map((_, i) => i)); return {q:esc(q.q), say:q.q, o:idx.map(i => q.o[i]), a:idx.indexOf(q.a), t:q.t, key:"q:" + q.id, why:q.why, no:idx.map(i => q.no[i])}; }
function sortQ(setId, i){ const s = SO[setId], it = s.items[i]; return {q:`${esc(s.title)}<br><b>${esc(it[0])}</b>`, say:it[0], o:s.cats.slice(), a:it[1], t:s.t, key:`s:${setId}:${i}`, why:`<b>${esc(it[0])}</b> → ${esc(s.cats[it[1]])}.`, no:s.cats.map((c, k) => k === it[1] ? null : `Not ${c}.`)}; }
function tfQ(i){ const x = TF[i]; return {q:`True or false?<br><b>${esc(x.s)}</b>`, say:x.s, o:["True","False"], a:x.v ? 0 : 1, t:x.t, key:"tf:" + i, why:x.v ? "It’s true!" : x.w, no:[x.v ? null : x.w, x.v ? "Actually it’s true." : null]}; }
function questionFor(key){
  const [k, a, b] = key.split(":");
  if (k === "q" && QZ[a]) return {type:"mcq", q:quizQ(QZ[a])};
  if (k === "c" && CARD[a]) { const c = CARD[a]; return (!c.noType && Math.random() < .5) ? {type:"type", q:typeCard(c)} : {type:"mcq", q:cardQ(c, "term")}; }
  if (k === "b" && BL[a]) return {type:"type", q:typeBlank(BL[a])};
  if (k === "s" && SO[a]) return {type:"mcq", q:sortQ(a, +b)};
  if (k === "tf" && TF[+a]) return {type:"mcq", q:tfQ(+a)};
  return null;
}
function typeCard(c){ return {prompt:`Type the term:<br><i>“${esc(c.def)}”</i>`, say:c.def, ans:[c.term].concat(c.alts || []), show:c.term, t:c.t, key:"c:" + c.id, why:c.def}; }
function typeBlank(b){ return {prompt:esc(b.q).replace(/_{2,}/g, '<b style="color:var(--coral)">____</b>'), say:b.q, ans:b.a, show:b.a[0], t:b.t, key:"b:" + b.id, why:""}; }

/* Render a multiple-choice question with instant feedback. done(ok) */
function mcq(el, q, done, opts){
  opts = opts || {};
  el.innerHTML = `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1"><div class="small">${tag(q.t)}</div><h3 style="margin-top:8px">${q.q}</h3></div>${sayBtn(q.say)}</div>` +
    q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("") + `<div class="fbx"></div>`;
  $$(".opt", el).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === q.a;
    $$(".opt", el).forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    const fbx = $(".fbx", el);
    fbx.innerHTML = ok ? `<div class="fb ok">✅ <b>Yes!</b> ${q.why}</div>` :
      `<div class="fb no">❌ <b>Not quite.</b> ${q.no[i] ? `<br><b>Your pick:</b> ${esc(q.no[i])}` : ""}<br><b>Right answer:</b> ${esc(q.o[q.a])} — ${q.why}</div>`;
    if (!opts.noRecord) record(q.t, ok, q.key);
    if (ok && opts.onRight) opts.onRight();
    if (ok && opts.autoNext) { setTimeout(() => done(ok), opts.autoNext); return; }
    fbx.insertAdjacentHTML("beforeend", `<button class="btn full nx">Next →</button>`);
    $(".nx", fbx).onclick = () => done(ok);
    $(".nx", fbx).scrollIntoView({behavior:"smooth", block:"nearest"});
  });
}
/* Typed answer */
function typed(el, q, done, opts){
  opts = opts || {};
  el.innerHTML = `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1"><div class="small">${tag(q.t)}</div><h3 style="margin-top:8px">${q.prompt}</h3></div>${sayBtn(q.say)}</div>
    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer…" aria-label="Your answer">
    <div class="row" style="margin-top:10px"><button class="btn go">Check</button><button class="btn alt hint">💡 First letter</button></div><div class="fbx"></div>`;
  const inp = $("input", el); setTimeout(() => inp.focus(), 50);
  let answered = false;
  $(".hint", el).onclick = () => { toast(`Starts with “${q.show.charAt(0).toUpperCase()}” — ${q.show.length} characters`); };
  const go = () => {
    if (answered) return; if (!inp.value.trim()) return toast("Type an answer first!");
    answered = true; inp.disabled = true; $(".go", el).disabled = true; $(".hint", el).disabled = true;
    const r = check(inp.value, q.ans), ok = !!r;
    const fbx = $(".fbx", el);
    fbx.innerHTML = r === "exact" ? `<div class="fb ok">✅ <b>Perfect!</b> ${q.why ? esc(q.why) : ""}</div>` :
      r === "close" ? `<div class="fb ok">✅ <b>Got it!</b> Watch the spelling: <b>${esc(q.show)}</b></div>` :
      `<div class="fb no">❌ The answer is <b>${esc(q.show)}</b>. ${q.why ? esc(q.why) : ""}</div>`;
    if (!opts.noRecord) record(q.t, ok, q.key);
    if (ok && opts.onRight) opts.onRight();
    fbx.insertAdjacentHTML("beforeend", `<button class="btn full nx">Next →</button>`);
    $(".nx", fbx).onclick = () => done(ok, r);

function buildQuiz(t, n){

  const keys = Object.keys(M).filter(k => k.split(":")[0] !== "o");
  const orderKeys = Object.keys(M).filter(k => k.startsWith("o:"));
  if (!keys.length && !orderKeys.length) return page(`<div class="card" style="text-align:center"><div style="font-size:3rem">🌈</div><h2>No Trouble Spots!</h2><p>Every time you miss something, it lands here until you get it right.</p><button class="btn" id="hm">Home</button></div>`), ($("#hm").onclick = home_);
  page(`<h2>🛠️ Trouble Spots</h2><p class="muted">These are things you missed. Get each one right to clear it!</p>
    <div class="card"><b>${keys.length}</b> to fix${orderKeys.length ? ` • plus ${orderKeys.length} timeline${orderKeys.length > 1 ? "s" : ""} to redo` : ""}
    <div class="small muted" style="margin-top:6px">${TOPICS.map(t => { const n = keys.filter(k => M[k].t === t.id).length; return n ? `${t.emoji} ${esc(t.name)}: ${n}` : ""; }).filter(Boolean).join(" • ")}</div></div>
    ${keys.length ? `<button class="btn full coral" id="st">Fix them (${Math.min(10, keys.length)} at a time)</button>` : ""}
    ${orderKeys.map(k => `<button class="btn alt full" style="margin-top:10px" data-o="${k.slice(2)}">⏳ Redo: ${esc(OR[k.slice(2)].title)}</button>`).join("")}`);
  if ($("#st")) $("#st").onclick = runTrouble;
  $$("[data-o]").forEach(b => b.onclick = () => { delete M["o:" + b.dataset.o]; save(); runOrder(b.dataset.o); });
}
function runTrouble(){
  const keys = shuffle(Object.keys(M).filter(k => !k.startsWith("o:"))).sort((a, b) => M[b].n - M[a].n).slice(0, 10);
  let i = 0, fixed = 0;
  const next = () => {
    while (i < keys.length && !questionFor(keys[i])) { delete M[keys[i]]; i++; }
    if (i >= keys.length) { save(); return endScreen(`Fixed ${fixed} of ${keys.length}!`, Object.keys(M).length ? `${Object.keys(M).length} Trouble Spots left.` : "All clear! 🌈", trouble_); }
    const key = keys[i], Q = questionFor(key);
    page(`<div class="row" style="justify-content:space-between"><h2>🛠️ Trouble Spots</h2><span class="muted">${i + 1} / ${keys.length}</span></div><div class="prog"><i style="width:${i / keys.length * 100}%"></i></div><div class="card" id="q"></div>`);
    const after = ok => { if (ok) { fixed++; clearMistake(key); addPts(5); } i++; next(); };
    Q.q.key = key;
    if (Q.type === "mcq") mcq($("#q"), Q.q, after, {noRecord:false}); else typed($("#q"), Q.q, after);
  };
  next();
}

/* =================== PRACTICE TEST =================== */
const ALLOC = {t1:2, t2:3, t3:2, t4:2, t5:3, t6:2, t7:2, t8:2, t9:2};
function test_(){
  const past = S.tests.slice(-3).reverse();
  page(`<h2>📝 Practice Test</h2><div class="card"><p>Set up like the real test:</p><ul><li><b>20 multiple choice</b></li><li><b>5 short answers</b> — write 2–3 sentences each</li></ul>
    <p class="small muted">No hints or feedback until you finish. Then you’ll see your score for each part and what to practise next.</p></div>
    ${past.length ? `<div class="card small"><b>Your recent tests</b>${past.map(p => `<div>${p.date}: multiple choice ${p.mc}/20 • short answers ${p.sa}%</div>`).join("")}</div>` : ""}
    <button class="btn full" id="st">Begin test</button>`);
  $("#st").onclick = runTest;
}
function runTest(){
  const mc = []; Object.entries(ALLOC).forEach(([t, n]) => sample(QUIZ.filter(q => q.t === t), n).forEach(q => mc.push(quizQ(q))));
  const qs = shuffle(mc);
  const sas = sample(SHORT, 5);
  const ans = new Array(qs.length).fill(-1), sat = new Array(sas.length).fill("");
  let i = 0;
  const drawMC = () => {
    const q = qs[i];
    page(`<div class="row" style="justify-content:space-between"><h2>📝 Part 1: Multiple Choice</h2></div><div class="row" style="justify-content:space-between"><span class="muted">Question ${i + 1} of 20</span><span class="muted small">${ans.filter(a => a >= 0).length} answered</span></div>
      <div class="prog"><i style="width:${(i + 1) / 20 * 100}%"></i></div>
      <div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><h3 style="flex:1">${i + 1}. ${q.q}</h3>${sayBtn(q.say)}</div>
      ${q.o.map((o, k) => `<button class="opt${ans[i] === k ? " sel" : ""}" data-k="${k}">${String.fromCharCode(65 + k)}. ${esc(o)}</button>`).join("")}</div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn alt full" id="pv" ${i === 0 ? "disabled" : ""}>← Back</button><button class="btn full" id="nx">${i === qs.length - 1 ? "On to Part 2 →" : "Next →"}</button></div>`);
    $$(".opt").forEach(b => b.onclick = () => { ans[i] = +b.dataset.k; $$(".opt").forEach(x => x.classList.toggle("sel", x === b)); });
    $("#pv").onclick = () => { i--; drawMC(); };
    $("#nx").onclick = () => { if (i < qs.length - 1) { i++; drawMC(); } else { const blank = ans.filter(a => a < 0).length; if (blank && !confirm(`You skipped ${blank} question${blank > 1 ? "s" : ""}. Go on to Part 2 anyway?`)) return; drawSA(); } };
  };
  const drawSA = () => {
    page(`<h2>📝 Part 2: Short Answer</h2><p class="muted">Answer each in 2–3 complete sentences. Use specific facts!</p>
      ${sas.map((s, k) => `<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><h3 style="flex:1">${k + 1}. ${esc(s.q)}</h3>${sayBtn(s.q)}</div><textarea data-k="${k}" placeholder="Write 2–3 sentences…">${esc(sat[k])}</textarea></div>`).join("")}
      <div class="row" style="flex-wrap:nowrap"><button class="btn alt full" id="pv">← Back to Part 1</button><button class="btn coral full" id="fin">Finish test</button></div>`);
    $$("textarea").forEach(t => t.oninput = () => { sat[+t.dataset.k] = t.value; });
    $("#pv").onclick = () => { i = qs.length - 1; drawMC(); };
    $("#fin").onclick = () => { const empty = sat.filter(x => !x.trim()).length; if (empty && !confirm(`${empty} short answer${empty > 1 ? "s are" : " is"} empty. Finish anyway?`)) return; selfCheck(); };
  };
  const selfCheck = () => {
    page(`<h2>✍️ Check your short answers</h2><p class="muted">For each answer, tick every key point you included. Be honest — it helps you learn!</p>
      ${sas.map((s, k) => `<div class="card"><h3>${k + 1}. ${esc(s.q)}</h3><div class="note"><b>You wrote:</b> ${sat[k].trim() ? esc(sat[k]) : "<i>(blank)</i>"}</div>
        <b class="small">A strong answer includes:</b>${s.keys.map((key, j) => `<label class="opt" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-k="${k}" data-j="${j}" style="margin-top:4px;transform:scale(1.3)"> <span>${esc(key)}</span></label>`).join("")}</div>`).join("")}
      <button class="btn full" id="res">See my results</button>`);
    $("#res").onclick = () => {
      const saScores = sas.map((s, k) => $$(`input[data-k="${k}"]:checked`).length / s.keys.length);
      results(saScores);
    };
  };
  const results = saScores => {
    let right = 0; const per = {};
    qs.forEach((q, k) => { const ok = ans[k] === q.a; if (ok) right++; const p = per[q.t] || (per[q.t] = {r:0, n:0}); p.n++; if (ok) p.r++; record(q.t, ok, q.key); });
    const sa = Math.round(saScores.reduce((a, b) => a + b, 0) / saScores.length * 100);
    sas.forEach((s, k) => { const p = per[s.t] || (per[s.t] = {r:0, n:0}); p.n += 1; p.r += saScores[k]; });
    const d = new Date(); S.tests.push({date:`${d.getMonth() + 1}/${d.getDate()}`, mc:right, sa:sa}); award("tester"); if (right >= 16) award("ace"); finished(); save();
    const weak = Object.entries(per).filter(([t, p]) => p.r / p.n < .75).sort((a, b) => a[1].r / a[1].n - b[1].r / b[1].n).slice(0, 3);
    page(`<h2>📊 Your Results</h2>
      <div class="card"><div class="bars">
        <div class="b"><div class="lbl"><span>Part 1: Multiple Choice</span><span>${right} / 20 (${right * 5}%)</span></div><div class="prog"><i style="width:${right * 5}%"></i></div></div>
        <div class="b"><div class="lbl"><span>Part 2: Short Answer (your self-check)</span><span>${sa}%</span></div><div class="prog"><i style="width:${sa}%;background:linear-gradient(90deg,var(--coral),var(--sun))"></i></div></div>
      </div></div>
      <div class="card"><h3>By topic</h3><div class="bars">${TOPICS.filter(t => per[t.id]).map(t => { const p = per[t.id], pc = Math.round(p.r / p.n * 100); return `<div class="b"><div class="lbl"><span>${t.emoji} ${esc(t.name)}</span><span>${pc}%</span></div><div class="prog"><i style="width:${pc}%;background:${t.color}"></i></div></div>`; }).join("")}</div></div>
      <div class="card"><h3>🧭 What to practise next</h3>${weak.length ? weak.map(([t]) => `<div class="row" style="margin:8px 0"><b style="flex:1">${TOPIC[t].emoji} ${esc(TOPIC[t].name)}</b><button class="btn alt" data-ch="${t}">Read chapter</button><button class="btn" data-qz="${t}">Quiz</button></div>`).join("") : "<p>Everything is 75% or higher — amazing! Keep it fresh with a Speed Round.</p>"}
      <p class="small muted">Wrong answers were added to Trouble Spots.</p></div>
      <h3>Review your multiple choice</h3>
      ${qs.map((q, k) => { const ok = ans[k] === q.a; return `<div class="card small"><b>${k + 1}. ${q.q}</b><div class="fb ${ok ? "ok" : "no"}">${ok ? "✅" : "❌"} ${ans[k] >= 0 ? `You chose: ${esc(q.o[ans[k]])}` : "Skipped"}${ok ? "" : `<br><b>Right answer:</b> ${esc(q.o[q.a])}`}<br>${q.why}${!ok && ans[k] >= 0 && q.no[ans[k]] ? `<br><i>Why not your pick:</i> ${esc(q.no[ans[k]])}` : ""}</div></div>`; }).join("")}
      <button class="btn full" id="hm">Home</button>`);
    $$("[data-ch]").forEach(b => b.onclick = () => chapter_(b.dataset.ch));
    $$("[data-qz]").forEach(b => b.onclick = () => runQuiz(b.dataset.qz));
    $("#hm").onclick = home_; confetti();
  };
  drawMC();
}

/* =================== UNIT REVIEW =================== */
function review_(){
  page(`<h2>📖 Unit Review</h2><p class="muted">One short chapter per topic: key facts, a rhyme, watch-outs, a study tip, and a 5-question quick check.</p>
    ${TOPICS.map((t, i) => `<button class="tile" style="width:100%;margin:10px 0;min-height:0;flex-direction:row;align-items:center;gap:12px;border-left:8px solid ${t.color}" data-ch="${t.id}"><span class="em">${t.emoji}</span><span style="flex:1"><b>Chapter ${i + 1}: ${esc(t.name)}</b><br><small>${S.chapters[t.id] ? `✅ Quick check: ${S.chapters[t.id]}/5` : "Not done yet"}</small></span><span>›</span></button>`).join("")}
    <div class="card small"><b>Your teacher’s study tips</b><ol><li>Mark each term green (know it), yellow (sort of), or red (don’t remember). Spend the most time on red and yellow — Trouble Spots does this for you!</li><li>Cover the descriptions and see how much you can say or type back from memory — like Type It.</li></ol></div>`);
  $$("[data-ch]").forEach(b => b.onclick = () => chapter_(b.dataset.ch));
}
function chapter_(t){
  const c = CHAPTERS[t], T = TOPIC[t], n = TOPICS.indexOf(T);
  const mine = Object.keys(M).filter(k => M[k].t === t).map(k => { const [a, b, x] = k.split(":"); if (a === "q") return QZ[b] && QZ[b].q; if (a === "c") return CARD[b] && CARD[b].term; if (a === "b") return BL[b] && BL[b].q; if (a === "s") return SO[b] && SO[b].items[+x][0]; if (a === "tf") return TF[+b] && TF[+b].s; return null; }).filter(Boolean).slice(0, 5);
  page(`${c.img ? `<div class="hero"><img src="${IMG[c.img]}" alt="${esc(T.name)} illustration"></div>${c.imgNote ? `<div class="note">${esc(c.imgNote)}</div>` : ""}` : ""}
    <div class="small muted">Chapter ${n + 1} of 9</div><h2>${T.emoji} ${esc(T.name)}</h2><p>${esc(c.intro)}</p>
    <div class="card"><div class="row" style="justify-content:space-between"><h3>⭐ Key facts</h3>${sayBtn(c.facts.join(". "))}</div><ul class="facts">${c.facts.map(f => `<li>${f}</li>`).join("")}</ul></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3>🎵 Remember it</h3><span class="kind ${c.rhyme.k}">${c.rhyme.k === "classic" ? "Classic" : "Original"}</span></div><div class="rhyme">${esc(c.rhyme.text)}</div><div class="row" style="margin-top:8px">${sayBtn(c.rhyme.text)} <span class="small muted">Say it out loud 3 times!</span></div></div>
    <div class="card"><h3>⚠️ Watch out!</h3><ul class="facts">${c.watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul>${mine.length ? `<div class="note"><b>Your own trouble spots here:</b><ul class="facts">${mine.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}</div>
    <div class="card"><h3>💡 Study tip</h3><p>${esc(c.tip)}</p></div>
    <div class="card" id="qc"><h3>✅ Quick check (5 questions)</h3><button class="btn full" id="qcs">Start quick check</button></div>
    <div class="row" style="flex-wrap:nowrap">${n > 0 ? `<button class="btn alt full" data-ch="${TOPICS[n - 1].id}">← Ch. ${n}</button>` : ""}${n < 8 ? `<button class="btn alt full" data-ch="${TOPICS[n + 1].id}">Ch. ${n + 2} →</button>` : `<button class="btn alt full" id="rv">All chapters</button>`}</div>`);
  $$("[data-ch]").forEach(b => b.onclick = () => chapter_(b.dataset.ch));
  if ($("#rv")) $("#rv").onclick = review_;
  $("#qcs").onclick = () => {
    const qs = sample(QUIZ.filter(q => q.t === t), 5).map(quizQ); let i = 0, s = 0; const box = $("#qc");
    const next = () => {
      if (i >= qs.length) { S.chapters[t] = Math.max(S.chapters[t] || 0, s); if (TOPICS.every(x => S.chapters[x.id] !== undefined)) award("reader"); finished(); save();
        box.innerHTML = `<h3>✅ Quick check: ${s} / 5</h3><p>${s === 5 ? "Perfect! 🌟" : "Your misses are in Trouble Spots."}</p><button class="btn" id="again">Try again</button>`; $("#again", box).onclick = () => chapter_(t); return; }
      const d = document.createElement("div"); box.innerHTML = `<div class="small muted">Quick check ${i + 1} / 5</div>`; box.appendChild(d);
      mcq(d, qs[i], ok => { if (ok) s++; i++; next(); box.scrollIntoView({behavior:"smooth", block:"start"}); });
    };
    next();
  };
}

/* =================== RHYMES =================== */
function rhymes_(){
  const all = TOPICS.map(t => ({t:t.id, title:t.name, k:CHAPTERS[t.id].rhyme.k, text:CHAPTERS[t.id].rhyme.text})).concat(RHYMES_EXTRA);
  page(`<h2>🎵 Rhymes & Memory Tricks</h2><p class="muted"><span class="kind classic">Classic</span> = a well-known trick lots of students learn. <span class="kind original">Original</span> = written just for this test.</p>
    ${all.map(r => `<div class="card"><div class="row" style="justify-content:space-between"><b>${TOPIC[r.t].emoji} ${esc(r.title)}</b><span class="kind ${r.k}">${r.k === "classic" ? "Classic" : "Original"}</span></div><div class="rhyme" style="margin-top:8px">${esc(r.text)}</div><div style="margin-top:8px">${sayBtn(r.text)}</div></div>`).join("")}`);
}

home_();
})();

</script>
